[package]
name                 = "ng_rs"
description          = "Library to parse/scrap Newgrounds.com in native applications"
version.workspace    = true
license.workspace    = true
categories.workspace = true
repository.workspace = true
homepage.workspace   = true
edition.workspace    = true
publish.workspace    = true

[features]
default = ["aud"]
aud = ["dep:ng_rs-aud"]
guard_unstable = ["dep:ng_rs-guard"]

[dependencies]
ng_rs-common.workspace = true
ng_rs-aud = { workspace = true, optional = true }
ng_rs-guard = { workspace = true, optional = true }
